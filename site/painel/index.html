<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada do paciente · Rede Acolher</title>
<meta name="description" content="Painel de trabalho da rede fictícia de clínicas-escola: a jornada de cada paciente da fila ao fim do tratamento, as clínicas e a qualidade dos dados.">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css?v=2">
<script>
  try { const t = localStorage.getItem("tema-painel"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="casca">
    <div class="casca-topo">
      <a class="produto" href="#/jornada" aria-label="Rede Acolher, início">
        <span class="marca" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span class="produto-nome">Rede Acolher</span>
      </a>
      <nav class="nav" aria-label="Telas">
        <a href="#/jornada" data-tela="jornada">Jornada <span class="contador" id="nav-sem-retorno" title="Pacientes sem retorno">–</span></a>
        <a href="#/clinicas" data-tela="clinicas">Clínicas</a>
        <a href="#/qualidade" data-tela="qualidade">Qualidade <span class="contador" id="nav-conferir" title="Linhas para conferir na origem">–</span></a>
        <a href="../" class="nav-externo">Resultados</a>
      </nav>
      <div class="casca-fim">
        <button class="icone" type="button" id="tema" aria-label="Alternar tema claro ou escuro">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <a class="botao-primario" href="https://github.com/DiegoSantiago1/clinicas-escola-indicadores">Código</a>
      </div>
    </div>
    <div class="casca-sub">
      <p class="trilha" id="trilha"><span>Rede Acolher</span><span aria-hidden="true">›</span><span id="trilha-atual">Jornada</span></p>
      <p class="estado"><span class="ponto" aria-hidden="true"></span><span id="estado">Base de 31/10/2026</span></p>
    </div>
  </header>

  <main id="tela" class="tela" aria-live="polite"></main>
</div>
<script src="painel.js?v=2"></script>
</body>
</html>
