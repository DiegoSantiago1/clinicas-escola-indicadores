[project]
name = "clinicas-escola"
version = "1.0.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"powerbi/*.py" = ["E501"]  # strings de M e DAX: quebrar a linha atrapalha a leitura
